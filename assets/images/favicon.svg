<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Royal Navy -->
    <linearGradient id="pyBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143166"/>
      <stop offset="45%" stop-color="#081429"/>
      <stop offset="100%" stop-color="#030814"/>
    </linearGradient>

    <!-- 24K Polished Metallic Gold Gradient -->
    <linearGradient id="pyGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="20%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="90%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Gold Border Ring Gradient -->
    <linearGradient id="pyBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Star Glow Effect -->
    <filter id="starGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Drop Shadow for Letter P -->
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Base Squircle / App Icon Foundation -->
  <rect x="20" y="20" width="472" height="472" rx="114" ry="114" 
        fill="url(#pyBgGrad)" 
        stroke="url(#pyBorderGrad)" 
        stroke-width="14"/>

  <!-- 2. Subtle Inner Gold Pinstripe -->
  <rect x="36" y="36" width="440" height="440" rx="98" ry="98" 
        fill="none" 
        stroke="rgba(253, 230, 138, 0.2)" 
        stroke-width="2"/>

  <!-- 3. Central Monogram 'P' (High-End Luxury Serif Silhouette) -->
  <g filter="url(#pShadow)">
    <path d="M 152 110 
             L 282 110 
             C 348 110, 388 142, 388 202 
             C 388 262, 348 294, 282 294 
             L 226 294 
             L 226 380 
             L 248 380 
             C 256 380, 260 384, 260 392
             L 260 398
             L 132 398
             L 132 392
             C 132 384, 136 380, 144 380
             L 152 380
             Z
             M 226 166 
             L 226 244 
             L 280 244 
             C 318 244, 336 232, 336 205 
             C 336 178, 318 166, 280 166 
             Z" 
          fill="url(#pyGoldGrad)" 
          stroke="#FFFBEB" 
          stroke-width="2.5"/>

    <!-- Left Serifs for the 'P' Stem (Top Bracket) -->
    <path d="M 132 110 L 176 110 L 176 118 L 152 118 L 152 165 L 132 165 Z" 
          fill="url(#pyGoldGrad)"/>
  </g>

  <!-- 4. The Golden 5-Pointed Star of May (Estrella de Mayo de Paraguay) -->
  <g filter="url(#starGlow)" transform="translate(376, 115)">
    <!-- Faceted 3D Star Points -->
    <polygon points="0,-48 14,-15 48,-15 21,7 31,40 0,20 -31,40 -21,7 -48,-15 -14,-15" 
             fill="url(#pyGoldGrad)" 
             stroke="#FFFBEB" 
             stroke-width="2"/>
    <!-- Core Diamond Sparkle -->
    <circle cx="0" cy="1" r="5" fill="#FFFFFF"/>
  </g>

  <!-- 5. Paraguayan National Tricolor Ribbon Pedestal (Red, White, Blue) -->
  <g transform="translate(136, 420)">
    <!-- Red Stripe (Top) -->
    <rect x="0" y="0" width="240" height="8" rx="3" fill="#C51D2A"/>
    <!-- White Stripe (Middle) -->
    <rect x="0" y="9" width="240" height="8" rx="2" fill="#FFFFFF"/>
    <!-- Blue Stripe (Bottom) -->
    <rect x="0" y="18" width="240" height="8" rx="3" fill="#173E7C"/>
    <!-- Thin Golden Accent Border -->
    <rect x="0" y="0" width="240" height="26" rx="3" fill="none" stroke="url(#pyBorderGrad)" stroke-width="1.5"/>
  </g>
</svg>

